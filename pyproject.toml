[project]
name = "myfitty"
version = "0.1.0"
description = "Local training-status app: FIT ingest, TSS and fitness/fatigue/form"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.40",
    "altair>=5",
    "fitdecode>=0.10",
    "duckdb>=1.1",
    "pyarrow>=17",
    "numpy>=1.26",
    "pandas>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["myfitty*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
